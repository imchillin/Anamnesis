name: Publish Anamnesis

permissions:
  id-token: write     # Required for attestations
  attestations: write # Required for attestations
  contents: write     # Required for creating the draft release

on:
  workflow_dispatch:
    inputs:
      channel:
        type: string
        description: 'Release channel (e.g., "stable")'
        required: true
        default: 'stable'
      version:
        type: string
        description: 'Semantic version (e.g., "1.1.0")'
        required: true

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Anamnesis
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Resolve channel input settings
        id: resolve_channel
        run: |
         # Process channel input
          $channelId = "${{ github.event.inputs.channel }}".Trim()
          if (-not (Test-Path "./channels.json")) {
            Write-Error "Error: channels.json manifest file not found in root directory."
            exit 1
          }

          $manifest = Get-Content ./channels.json | ConvertFrom-Json
          if (-not $manifest.channels.PSObject.Properties[$channelId]) {
            Write-Error "Error: Channel '$channelId' is not defined in the channels manifest file (channels.json). Add the channel to the manifest before running this job."
            exit 1
          }

          $channelData = $manifest.channels.$channelId

          # Process input version
          $inputVer = "${{ github.event.inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($inputVer)) {
            Write-Error "Error: Version parameter is required."
            exit 1
          }
          $targetVer = $inputVer -replace '^v', ''

          # Construct tag name according to channel
          if ($channelId -eq "stable") {
            $tag = "v$targetVer"
            $isPreRelease = "false"
          } else {
            $tag = "v$targetVer-$channelId"
            $isPreRelease = "true"
          }

          # Process VPK channel name
          $vpkChannel = if ($channelId.StartsWith("win-")) { $channelId } else { "win-$channelId" }

          # Export values as environment variables for later steps
          echo "RELEASE_VERSION=$targetVer" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "IS_PRERELEASE=$isPreRelease" >> $env:GITHUB_ENV
          echo "VPK_CHANNEL=$vpkChannel" >> $env:GITHUB_ENV

          Write-Host "Target Version: $targetVer"
          Write-Host "Release Tag: $tag"
          Write-Host "Is Pre-release: $isPreRelease"

      - name: Fetch framework version from local global file
        id: fetch_framework_version
        run: |
          $globalJson = Get-Content ./global.json | ConvertFrom-Json
          $cleanVersion = $globalJson.sdk.version -replace '-.*$', ''
          $parsedVersion = [version]$cleanVersion
          $framework = "net$($parsedVersion.Major).$($parsedVersion.Minor)-x64-desktop"
          
          echo "DESKTOP_FRAMEWORK=$framework" >> $env:GITHUB_ENV
          Write-Host "Framework Target: $framework"

      - name: Check if tag already exists
        run: |
          git fetch --tags
          if (git tag -l "${{ env.RELEASE_TAG }}") {
            Write-Error "Tag ${{ env.RELEASE_TAG }} already exists. Aborting release."
            exit 1
          }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Publish Anamnesis
        run: dotnet publish Anamnesis/Anamnesis.csproj `
          /p:PublishProfile=".\Anamnesis\Properties\PublishProfiles\FolderProfile.pubxml" `
          /p:DefineConstants="CI_BUILD" `
          /p:Version="${{ env.RELEASE_VERSION }}"

      - name: Publish UpdateExtractor
        run: dotnet publish UpdateExtractor/UpdateExtractor.csproj `
          /p:PublishProfile=".\UpdateExtractor\Properties\PublishProfiles\FolderProfile.pubxml" `
          /p:DefineConstants="CI_BUILD"

      - name: Generate artifact attestation Anamnesis
        uses: actions/attest@v4
        with:
          subject-path: './publish/Anamnesis.exe'

      - name: Generate artifact attestation Updater
        uses: actions/attest@v4
        with:
          subject-path: './publish/Updater/UpdateExtractor.exe'

      - name: Delete pdb and xml
        run: |
          Get-ChildItem -Path './publish/*' -Recurse -Include *.pdb,*.xml -File | Remove-Item -Force
          Get-ChildItem -Path './publish/*' -Recurse -Include FASM*,Reloaded.*,AetherTools.Anamnesis.Reloaded.* -File | Remove-Item -Force

      - name: Copy updater and clean up publish directory
        id: copy_updater
        run: |
          New-Item -ItemType Directory -Path "./Migration/Updater" -Force
          Copy-Item "./publish/Updater/UpdateExtractor.exe" -Destination "./Migration/Updater/"

          # Removed to avoid including unused files in the release package.
          Remove-Item -Path "./publish/Updater" -Recurse -Force

      - name: Install Velopack CLI & Build Package
        run: |
          dotnet tool install -g vpk
          
          # Download previous release metadata for delta package generation
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel "${{ env.VPK_CHANNEL }}"

          # Create Velopack release & MSI installer
          vpk pack `
            -u Anamnesis `
            -v "${{ env.RELEASE_VERSION }}" `
            -p "./publish" `
            -e "Anamnesis.exe" `
            -c "${{ env.VPK_CHANNEL }}" `
            --framework "${{ env.DESKTOP_FRAMEWORK }}" `
            --noPortable `
            --msi `
            --msiBanner "./Anamnesis/Assets/MsiBackground.bmp" `
            --msiLogo "./Anamnesis/Assets/MsiTopBanner.bmp" `
            --instLicense "./LICENSE.md" `
            -o "./Releases"

      - name: Create migration archive
        id: create_migration_archive
        run: |
          $msiFile = Get-ChildItem -Path "./Releases/*.msi" | Select-Object -First 1
          if (-not $msiFile) {
            Write-Error "Velopack MSI output was not found in ./Releases"
            exit 1
          }
          Copy-Item $msiFile.FullName -Destination "./Migration/Updater/"

          Compress-Archive -Path "./Migration/*" -DestinationPath "./Migration.zip" -Force

      - name: Create draft release & upload Velopack artifacts
        id: upload_vpk
        run: |
          $vpkArgs = @(
            "upload", "github",
            "--repoUrl", "https://github.com/${{ github.repository }}",
            "--releaseName", "${{ env.RELEASE_TAG }}",
            "--tag", "${{ env.RELEASE_TAG }}",
            "--channel", "${{ env.VPK_CHANNEL }}",
            "--token", "${{ secrets.GITHUB_TOKEN }}",
            "--targetCommitish", "${{ github.sha }}",
            "--outputDir", "./Releases"
          )

          if ("${{ env.IS_PRERELEASE }}" -eq "true") {
            $vpkArgs += "--pre"
          }

          vpk @vpkArgs

      - name: Append migration archive to draft release
        id: upload_migration
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" "./Migration.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
